<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landlord Dashboard - HouseHunt Kenya</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/yvzp2mhd/image/upload/v1791334545/deepseek_20261007_09b360.png">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
    --accent-light: #dbeafe;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-dark: #d1d5db;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --success: #15803d;
    --success-bg: #dcfce7;
    --warn: #f59e0b;
    --warn-bg: #fef3c7;
    --purple: #7c3aed;
    --purple-bg: #f3e8ff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header {
    background: white;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .header-inner {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
  .logo img { height: 40px; width: 40px; border-radius: 50%; object-fit: cover; background: white; border: 1px solid var(--border); }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; }
  .logo-text .main { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); }
  .logo-text .main span { color: var(--accent); }
  .logo-text .sub { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
  .header-user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .role-badge {
    background: var(--purple-bg); color: var(--purple);
    padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .user-name { font-size: 13px; font-weight: 700; color: var(--text); }
 /* BUTTONS */
  .btn {
    padding: 10px 14px; border-radius: 8px; border: none;
    font-weight: 700; font-size: 12.5px; cursor: pointer;
    transition: all 0.2s; text-decoration: none;
    display: inline-block; text-align: center;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-outline { background: white; color: var(--text); border: 1px solid var(--border-dark); }
  .btn-outline:hover { background: var(--bg); }
  .btn-call { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 9px 14px; font-size: 12px; }
  .btn-whatsapp { background: #25D366; color: white; border: none; padding: 9px 14px; font-size: 12px; }
  .btn-whatsapp:hover { background: #1DAF57; }
  .btn-handle { background: var(--success-bg); color: var(--success); border: 1px solid rgba(21,128,61,0.3); padding: 9px 14px; font-size: 12px; }
  .btn-handle:hover { background: #bbf7d0; }

  /* LOGIN GATE */
  .login-gate {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 9999;
  }
  .login-gate .gate-box {
    background: white; padding: 36px 28px; border-radius: 18px;
    text-align: center; max-width: 400px; width: 100%;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
  }
  .login-gate .gate-box h2 { font-size: 20px; margin-bottom: 10px; color: var(--text); }
  .login-gate .gate-box p { color: var(--muted); font-size: 13.5px; margin-bottom: 22px; line-height: 1.5; }

  /* STATS CARDS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0 24px;
  }
  .stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow-sm);
    text-align: center;
    transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-card .icon { font-size: 24px; margin-bottom: 8px; }
  .stat-card .value { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; margin-bottom: 4px; }
  .stat-card .label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card.new .value { color: var(--accent); }
  .stat-card.prop .value { color: var(--purple); }
  .stat-card.total .value { color: var(--success); }

  /* SECTION HEADER */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap; gap: 10px;
  }
  .section-header h2 { font-size: 18px; font-weight: 800; color: var(--text); }
  .section-header .count { color: var(--muted); font-size: 12px; font-weight: 600; }

  /* FILTER CHIPS */
  .filter-bar {
    display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 7px 14px; border-radius: 20px; white-space: nowrap;
    background: white; border: 1px solid var(--border-dark);
    color: var(--text); font-size: 11.5px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* ENQUIRY CARDS */
  .enquiry-item {
    background: white;
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s;
  }
  .enquiry-item:hover { box-shadow: var(--shadow-md); }

  .enquiry-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .enquiry-ref {
    font-size: 13px; font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .enquiry-property {
    font-size: 15px; font-weight: 800; color: var(--text);
    margin-bottom: 3px;
  }
  .enquiry-location {
    font-size: 12px; color: var(--muted);
  }
  .enquiry-tenant {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin: 10px 0 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .enquiry-phone {
    font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .enquiry-phone a { color: var(--accent); text-decoration: none; font-weight: 700; }

  .enquiry-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 12.5px;
    margin: 12px 0;
    padding: 12px;
    background: var(--bg);
    border-radius: 10px;
  }
  .enquiry-details .label {
    color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 700;
    display: block; margin-bottom: 3px;
  }
  .enquiry-details .value {
    font-size: 13px; color: var(--text); font-weight: 600;
    word-break: break-word;
  }

  .enquiry-msg {
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
    font-style: italic;
  }

  .enquiry-actions {
    display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
    padding-top: 14px; border-top: 1px solid var(--border);
  }

  /* STATUS BADGES */
  .badge {
    display: inline-block;
    font-size: 10px; padding: 4px 10px; border-radius: 6px;
    font-weight: 800; letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-new {
    background: var(--accent-light); color: var(--accent-dark);
    border: 1px solid rgba(59,130,246,0.3);
  }
  .badge-handled {
    background: var(--success-bg); color: var(--success);
    border: 1px solid rgba(21,128,61,0.3);
  }

  /* LOADING + EMPTY */
  .loading { text-align: center; padding: 50px; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 56px; margin-bottom: 14px; opacity: 0.5; }
  .empty-state .title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty-state .subtitle { font-size: 13px; }

  /* ALERTS */
  .alert {
    padding: 12px 16px; border-radius: 10px; font-size: 13px;
    margin-bottom: 14px; display: none; line-height: 1.5;
  }
  .alert.err { background: var(--danger-bg); color: var(--danger); display: block; border: 1px solid rgba(220,38,38,0.3); }
  .alert.ok { background: var(--success-bg); color: var(--success); display: block; border: 1px solid rgba(21,128,61,0.3); }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr; gap: 10px; }
    .enquiry-details { grid-template-columns: 1fr; }
    .stat-card .value { font-size: 22px; }
  }
</style>
</head>
<body><!-- LOGIN GATE -->
<div class="login-gate" id="loginGate">
  <div class="gate-box">
    <div style="font-size: 44px; margin-bottom: 12px;">🔒</div>
    <h2>Landlord Access Required</h2>
    <p>You need to be signed in as a Landlord to view this dashboard.</p>
    <a href="/" class="btn btn-primary" style="width: 100%; padding: 14px;">Go to Homepage</a>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="container header-inner">
    <div class="logo">
      <img src="https://res.cloudinary.com/yvzp2mhd/image/upload/v1791334545/deepseek_20261007_09b360.png" alt="HouseHunt Kenya">
      <div class="logo-text">
        <div class="main">HouseHunt <span>Kenya</span></div>
        <div class="sub">Landlord Dashboard</div>
      </div>
    </div>
    <div class="header-user">
      <span class="role-badge" id="userRole">Landlord</span>
      <span class="user-name" id="userName">...</span>
      <button class="btn btn-outline" onclick="logout()" style="padding: 7px 14px; font-size: 11.5px;">Logout</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- STATS CARDS -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card prop">
      <div class="icon">🏠</div>
      <div class="value" id="statProperties">-</div>
      <div class="label">My Properties</div>
    </div>
    <div class="stat-card new">
      <div class="icon">🔵</div>
      <div class="value" id="statNew">-</div>
      <div class="label">New Enquiries</div>
    </div>
    <div class="stat-card total">
      <div class="icon">💬</div>
      <div class="value" id="statTotal">-</div>
      <div class="label">Total Enquiries</div>
    </div>
  </div>

  <!-- ENQUIRIES SECTION -->
  <div class="section-header">
    <h2>💬 Direct Enquiries</h2>
    <span class="count" id="enquiryCount">-</span>
  </div>

  <div class="filter-bar" id="enquiryFilters">
    <button class="filter-chip active" onclick="filterEnquiries(this, 'all')">All</button>
    <button class="filter-chip" onclick="filterEnquiries(this, 'new')">🔵 New</button>
    <button class="filter-chip" onclick="filterEnquiries(this, 'handled')">✅ Handled</button>
  </div>

  <div class="alert err" id="enquiriesError"></div>

  <div id="enquiriesList">
    <div class="loading"><div class="spinner"></div>Loading enquiries...</div>
  </div>
</div>

<script>
const API_BASE = 'https://house-hunt-server.onrender.com';

let state = {
  token: localStorage.getItem('hh_token') || null,
  user: JSON.parse(localStorage.getItem('hh_user') || 'null'),
  allEnquiries: [],
  currentFilter: 'all'
};

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function checkAuth() {
  const gate = document.getElementById('loginGate');
  if (!state.token || !state.user || (state.user.role !== 'landlord' && state.user.role !== 'admin')) {
    gate.style.display = 'flex'; return false;
  }
  gate.style.display = 'none';
  document.getElementById('userName').textContent = state.user.name;
  document.getElementById('userRole').textContent = state.user.role;
  return true;
}

function logout() {
  localStorage.removeItem('hh_token');
  localStorage.removeItem('hh_user');
  window.location.href = '/';
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatTimeAgo(dateStr) {
  if (!dateStr) return '—';
  const now = new Date();
  const d = new Date(dateStr);
  const diffSec = Math.floor((now - d) / 1000);
  if (diffSec < 60) return 'Just now';
  if (diffSec < 3600) return Math.floor(diffSec / 60) + ' min ago';
  if (diffSec < 86400) return Math.floor(diffSec / 3600) + ' hrs ago';
  if (diffSec < 172800) return 'Yesterday';
  return Math.floor(diffSec / 86400) + ' days ago';
}
// ============================================================
// LOAD ENQUIRIES
// ============================================================
async function loadEnquiries() {
  const list = document.getElementById('enquiriesList');
  const count = document.getElementById('enquiryCount');
  const errEl = document.getElementById('enquiriesError');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading enquiries...</div>';
  errEl.style.display = 'none';

  try {
    const res = await api('/api/landlord/enquiries?limit=100');
    state.allEnquiries = res.enquiries || [];
    count.textContent = state.allEnquiries.length + ' enquir' + (state.allEnquiries.length !== 1 ? 'ies' : 'y');
    renderEnquiries();
  } catch (e) {
    errEl.textContent = 'Failed: ' + e.message;
    errEl.style.display = 'block';
    list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="title">Failed to load enquiries</div><div class="subtitle">Please refresh the page.</div></div>';
  }
}

// ============================================================
// LOAD STATS
// ============================================================
async function loadStats() {
  try {
    const res = await api('/api/landlord/stats');
    document.getElementById('statProperties').textContent = res.total_properties || 0;
    document.getElementById('statNew').textContent = res.new_enquiries || 0;
    document.getElementById('statTotal').textContent = res.total_enquiries || 0;
  } catch (e) {
    document.getElementById('statProperties').textContent = '0';
    document.getElementById('statNew').textContent = '0';
    document.getElementById('statTotal').textContent = '0';
  }
}

// ============================================================
// FILTER
// ============================================================
function filterEnquiries(btn, filter) {
  document.querySelectorAll('#enquiryFilters .filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.currentFilter = filter;
  renderEnquiries();
}

// ============================================================
// RENDER ENQUIRIES
// ============================================================
function renderEnquiries() {
  const list = document.getElementById('enquiriesList');
  let items = state.allEnquiries.slice();

  if (state.currentFilter === 'new') {
    items = items.filter(e => e.status === 'new');
  } else if (state.currentFilter === 'handled') {
    items = items.filter(e => e.status === 'handled');
  }

  if (items.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <div class="title">No enquiries found</div>
        <div class="subtitle">${state.currentFilter === 'all' ? 'You have no enquiries yet.' : 'No ' + state.currentFilter + ' enquiries.'}</div>
      </div>
    `;
    return;
  }

  list.innerHTML = items.map(e => {
    const isHandled = e.status === 'handled';
    const statusBadge = isHandled
      ? '<span class="badge badge-handled">✅ Handled</span>'
      : '<span class="badge badge-new">🔵 New</span>';
    const timeAgo = formatTimeAgo(e.created_at);
    const waNumber = (e.tenant_phone || '').replace(/\D/g, '').replace(/^0/, '254');
    const waText = encodeURIComponent('Hi ' + e.tenant_name + ', regarding your enquiry for ' + e.property_title + ' (Ref: ' + e.reference + ')...');

    return `
      <div class="enquiry-item">
        <div class="enquiry-head">
          <div style="flex:1; min-width:0;">
            <div class="enquiry-ref">🆔 ${escapeHtml(e.reference)} · ${timeAgo}</div>
            <div class="enquiry-property">${escapeHtml(e.property_title || 'Property')}</div>
            <div class="enquiry-location">📍 ${escapeHtml(e.property_location || '')}</div>
          </div>
          <div>${statusBadge}</div>
        </div>

        <div class="enquiry-tenant">👤 ${escapeHtml(e.tenant_name)}</div>
        <div class="enquiry-phone">📞 <a href="tel:${escapeHtml(e.tenant_phone)}">${escapeHtml(e.tenant_phone)}</a></div>

        <div class="enquiry-details">
          ${e.move_in_date ? `<div><span class="label">Move-in Date</span><span class="value">${escapeHtml(e.move_in_date)}</span></div>` : ''}
          ${e.property_price ? `<div><span class="label">Property Price</span><span class="value">KES ${Number(e.property_price).toLocaleString()}</span></div>` : ''}
          <div><span class="label">Enquiry Type</span><span class="value">${e.type === 'landlord' ? '📞 Direct' : '📅 Viewing'}</span></div>
          <div><span class="label">Received</span><span class="value">${timeAgo}</span></div>
        </div>

        ${e.message ? `<div class="enquiry-msg">💬 "${escapeHtml(e.message)}"</div>` : ''}

        <div class="enquiry-actions">
          <a href="tel:${escapeHtml(e.tenant_phone)}" class="btn btn-call" style="text-decoration:none;">📞 Call Tenant</a>
          <a href="https://wa.me/${waNumber}?text=${waText}" target="_blank" rel="noopener" class="btn btn-whatsapp" style="text-decoration:none;">💬 WhatsApp</a>
          ${!isHandled ? `<button class="btn btn-handle" onclick="markHandled('${e.id}')">✅ Mark Handled</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// MARK ENQUIRY AS HANDLED
// ============================================================
async function markHandled(id) {
  if (!confirm('Mark this enquiry as handled?')) return;
  try {
    await api('/api/landlord/enquiries/' + id + '/handle', { method: 'POST' });
    loadEnquiries();
    loadStats();
  } catch (e) {
    alert('Failed: ' + e.message);
  }
}// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  if (checkAuth()) {
    loadStats();
    loadEnquiries();
  }
});
</script>
</body>
</html>
